<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catatan pemateri · Wonogiri</title><style>body{font:18px system-ui;background:#0b1d30;color:#edf5ff;max-width:1000px;margin:40px auto;padding:20px}select,button,a{font:inherit;padding:12px;background:#163e55;color:#eafff9;border:1px solid #4e9e99;border-radius:8px}article{margin-top:30px;padding:30px;background:#163347;border-radius:20px;line-height:1.7}nav{display:flex;gap:12px;flex-wrap:wrap}small{color:#b8ccdc}</style><h1>Catatan pemateri</h1><p>File lokal khusus pemateri. Tidak dimasukkan ke hasil build GitHub Pages.</p><nav><select id="pick" aria-label="Pilih slide"></select><button id="prev">←</button><button id="next">→</button><a id="open" target="_blank" rel="noopener" href="../index.html">Buka slide</a></nav><article><small id="number"></small><h2 id="title"></h2><p id="note"></p></article><script>const notes=[{"slide":1,"label":"Mengapa data penting","note":"Buka pembahasan dengan kegunaan data untuk layanan peserta didik, kebutuhan guru dan rombel, serta sarana prasarana. Hubungkan contoh dengan pekerjaan operator sebelum membahas IKD dan DQM."},{"slide":2,"label":"Tujuan","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":3,"label":"Alur kebijakan","note":"Jelaskan tiga komponen IKD dan empat dimensi DQM secara terpisah. Nilai IKD resmi tidak berasal dari DQM. Rata-rata sekolah berbeda dari skor wilayah. Jangan membandingkan selisih skor IKD dan DQM sebagai perubahan kinerja."},{"slide":4,"label":"Kerangka pengukuran IKD","note":"Jelaskan kerangka resmi IKD dari Ditjen PAUD Dikdasmen: tiga komponen (kelengkapan, validitas, kemutakhiran) pada tujuh objek data. Bedakan dari DQM yang memakai 33 indikator dengan empat dimensi. Jumlah sub-indikator per objek dihitung dari materi resmi."},{"slide":5,"label":"IKD data sekolah","note":"Tekankan kelengkapan isian identitas sekolah dan validitasnya; kaitkan dengan temuan DQM pada indikator serupa. Kemutakhiran menuntut pembaruan data sekolah pada semester berjalan."},{"slide":6,"label":"IKD data PTK","note":"PTK memiliki sub-indikator terbanyak (15 kelengkapan, 17 validitas); soroti keunikan NUPTK/NIP/NIK dan aturan GTY. Catatan sumber: teks mutakhir pada materi asli menyebut prasarana rombel (kemungkinan kekeliruan template); slide memakai rumusan umum pembaruan semester berjalan."},{"slide":7,"label":"IKD data peserta didik","note":"Soroti NISN/NIK unik dan usia sesuai; email/telepon peserta didik hanya untuk SMP/SMA sederajat; 100% peserta didik SLB terdata berkebutuhan khusus. Kaitkan dengan residu PD pada slide terkait."},{"slide":8,"label":"IKD data rombel","note":"Rombel: jumlah peserta didik per rombel dan jumlah rombel per satuan pendidikan harus sesuai standar; anggota rombel wajib terisi."},{"slide":9,"label":"IKD data tanah","note":"Tanah: sertifikat berformat 14 digit dan unik; luas lahan 100-50.000 m2; sekolah negeri berstatus milik sendiri; akumulasi tapak tidak melebihi luas tanah."},{"slide":10,"label":"IKD data bangunan","note":"Bangunan: setiap bangunan terisi data ruang; luas tapak lebih besar dari total luas ruang lantai 1; kondisi kerusakan konsisten dengan akumulasi kerusakan ruang."},{"slide":11,"label":"IKD data ruang","note":"Ruang: konsistensi dimensi (panjang x lebar) dan jumlah ruang antarsemester; rasio kelas terhadap rombel memadai; pendataan APE khusus PAUD."},{"slide":12,"label":"Cakupan kabupaten","note":"Jelaskan cakupan dan tanggal sumber pada slide. Jangan menyamakan IKD resmi dengan DQM."},{"slide":13,"label":"Capaian IKD Jawa Tengah","note":"Soroti Wonogiri peringkat 1 Jawa Tengah sesuai konfirmasi pengelola pada 27 Oktober 2026. Skor 85,00 dan tiga komponen bersumber dari sheet pada 26 Oktober. Kolom peringkat sheet yang dibaca pada revisi masih kosong; jangan menyebutnya hasil verifikasi peringkat otomatis. Prioritas terendah: kemutakhiran 76,57%."},{"slide":14,"label":"IKD menurut jenjang","note":"Jelaskan cakupan dan tanggal sumber pada slide. Jangan menyamakan IKD resmi dengan DQM."},{"slide":15,"label":"Peringkat IKD kab","note":"Peringkat menggunakan IKD resmi, bukan DQM. Tampilkan 3 tertinggi dan 10 terendah pada naungan kabupaten; filter PAUD/SD/SMP/nonformal tersedia. Kabupaten memiliki 1.765 sekolah dengan IKD. Nilai sama diurutkan NPSN, bukan berarti kualitas berbeda. Daftar prioritas bukan daftar hadir."},{"slide":16,"label":"Kecamatan kabupaten","note":"Jelaskan cakupan dan tanggal sumber pada slide. Jangan menyamakan IKD resmi dengan DQM."},{"slide":17,"label":"IKD sekolah","note":"Bedakan IKD resmi dan DQM. Peringkat terbaru belum tersedia. Label periode historis terpotong sehingga perubahan antarperiode belum dapat disimpulkan. Kemutakhiran 76,57% adalah komponen IKD terendah pada snapshot 26 Oktober."},{"slide":18,"label":"Cara membaca skor","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":19,"label":"Potret Wonogiri","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":20,"label":"Masalah DQM kabupaten","note":"Jelaskan cakupan dan tanggal sumber pada slide. Jangan menyamakan IKD resmi dengan DQM."},{"slide":21,"label":"Fokus SD","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":22,"label":"Empat dimensi","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":23,"label":"Masalah prioritas","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":24,"label":"Kecamatan","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":25,"label":"50 SD prioritas","note":"Daftar ini memakai skor DQM. Jangan menyebutnya daftar peserta atau peringkat IKD. Peserta dicatat dari konfirmasi kehadiran aktual."},{"slide":26,"label":"Batas DQM PD dan PTK","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":27,"label":"Potret Residu PD","note":"Rekap diperbarui 26 Oktober 2026 dan memuat 333 baris sekolah. Satu anak dapat muncul dalam beberapa kategori; jumlah kategori bukan jumlah anak unik."},{"slide":28,"label":"Residu per jenjang","note":"Rekap diperbarui 26 Oktober 2026 dan memuat 333 baris sekolah. Satu anak dapat muncul dalam beberapa kategori; jumlah kategori bukan jumlah anak unik."},{"slide":29,"label":"Perbaikan residu siswa","note":"Rekap diperbarui 26 Oktober 2026 dan memuat 333 baris sekolah. Satu anak dapat muncul dalam beberapa kategori; jumlah kategori bukan jumlah anak unik."},{"slide":30,"label":"Penerbitan NUPTK","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":31,"label":"Rekap ATS","note":"Gunakan agregat saja. Status VALID_STRUKTUR belum membuktikan kelengkapan terhadap total sumber. Jangan menyamakan status verifikasi ATS dengan anak sudah kembali bersekolah."},{"slide":32,"label":"Perbandingan naungan","note":"Cukup jelaskan perbandingan singkat ini. Analisis dan pendampingan mendalam tetap fokus pada kabupaten. Kemenag belum memiliki IKD pada sumber; jangan menggantinya dengan DQM."},{"slide":33,"label":"Cakupan lima sumber","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":34,"label":"Klinik NPSN","note":"Minta peserta memasukkan NPSN sendiri. Bandingkan IKD dan DQM secara terpisah. Baca indikator gagal dan aplikasi sumber; catat tindak lanjut manual. Status selesai tidak membuktikan hasil evaluasi membaik."},{"slide":35,"label":"Aplikasi sumber","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":36,"label":"Praktik 20 menit","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":37,"label":"Rencana 30 hari","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":38,"label":"Checklist","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."},{"slide":39,"label":"Diskusi","note":"Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}];let i=0;const pick=document.getElementById('pick');notes.forEach((x,j)=>pick.add(new Option(x.slide+' · '+x.label,j)));function show(n){i=Math.max(0,Math.min(notes.length-1,n));pick.value=i;document.getElementById('number').textContent='Slide '+notes[i].slide+' / '+notes.length;document.getElementById('title').textContent=notes[i].label;document.getElementById('note').textContent=notes[i].note;document.getElementById('open').href='../index.html#slide-'+notes[i].slide;}pick.onchange=()=>show(Number(pick.value));document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});show(0);</script></html>

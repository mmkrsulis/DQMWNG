ilter PAUD/SD/SMP/nonformal tersedia. Kabupaten memiliki 1.765 sekolah dengan IKD. Nilai sama diurutkan NPSN, bukan berarti kualitas berbeda. Daftar prioritas bukan daftar hadir."}, {"slide": 6, "label": "Kecamatan kabupaten", "note": "Jelaskan cakupan dan tanggal sumber pada slide. Jangan menyamakan IKD resmi dengan DQM."}, {"slide": 7, "label": "Masalah DQM kabupaten", "note": "Jelaskan cakupan dan tanggal sumber pada slide. Jangan menyamakan IKD resmi dengan DQM."}, {"slide": 8, "label": "Fokus SD", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 9, "label": "Empat dimensi", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 10, "label": "Masalah prioritas", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 11, "label": "Kecamatan", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 12, "label": "50 SD prioritas", "note": "Daftar ini memakai skor DQM. Jangan menyebutnya daftar peserta atau peringkat IKD. Peserta dicatat dari konfirmasi kehadiran aktual."}, {"slide": 13, "label": "IKD sekolah", "note": "Bedakan IKD resmi dan DQM. Peringkat terbaru belum tersedia. Label periode historis terpotong sehingga perubahan antarperiode belum dapat disimpulkan. Kemutakhiran 76,57% adalah komponen IKD terendah pada snapshot 26 Oktober."}, {"slide": 14, "label": "Klinik NPSN", "note": "Minta peserta memasukkan NPSN sendiri. Bandingkan IKD dan DQM secara terpisah. Baca indikator gagal dan aplikasi sumber; catat tindak lanjut manual. Status selesai tidak membuktikan hasil evaluasi membaik."}, {"slide": 15, "label": "Cara membaca skor", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 16, "label": "Batas DQM PD dan PTK", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 17, "label": "Potret Residu PD", "note": "Rekap diperbarui 26 Oktober 2026 dan memuat 333 baris sekolah. Satu anak dapat muncul dalam beberapa kategori; jumlah kategori bukan jumlah anak unik."}, {"slide": 18, "label": "Residu per jenjang", "note": "Rekap diperbarui 26 Oktober 2026 dan memuat 333 baris sekolah. Satu anak dapat muncul dalam beberapa kategori; jumlah kategori bukan jumlah anak unik."}, {"slide": 19, "label": "Perbaikan residu siswa", "note": "Rekap diperbarui 26 Oktober 2026 dan memuat 333 baris sekolah. Satu anak dapat muncul dalam beberapa kategori; jumlah kategori bukan jumlah anak unik."}, {"slide": 20, "label": "Penerbitan NUPTK", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 21, "label": "Aplikasi sumber", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 22, "label": "Praktik 20 menit", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 23, "label": "Rencana 30 hari", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 24, "label": "Checklist", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 25, "label": "Perbandingan naungan", "note": "Cukup jelaskan perbandingan singkat ini. Analisis dan pendampingan mendalam tetap fokus pada kabupaten. Kemenag belum memiliki IKD pada sumber; jangan menggantinya dengan DQM."}, {"slide": 26, "label": "Rekap ATS", "note": "Gunakan agregat saja. Status VALID_STRUKTUR belum membuktikan kelengkapan terhadap total sumber. Jangan menyamakan status verifikasi ATS dengan anak sudah kembali bersekolah."}, {"slide": 27, "label": "Cakupan lima sumber", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 28, "label": "Mengapa data penting", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 29, "label": "Alur kebijakan", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 30, "label": "Tujuan", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}, {"slide": 31, "label": "Diskusi", "note": "Jelaskan pesan utama slide, kemudian hubungkan dengan kondisi sekolah peserta. Gunakan tanggal sumber yang ditampilkan; jangan menganggap snapshot sebagai data live."}];let i=0;const pick=document.getElementById('pick');notes.forEach((x,j)=>pick.add(new Option(x.slide+' · '+x.label,j)));function show(n){i=Math.max(0,Math.min(notes.length-1,n));pick.value=i;document.getElementById('number').textContent='Slide '+notes[i].slide+' / '+notes.length;document.getElementById('title').textContent=notes[i].label;document.getElementById('note').textContent=notes[i].note;document.getElementById('open').href='../index.html#slide-'+notes[i].slide;}pick.onchange=()=>show(Number(pick.value));document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});show(0);</script></html>

name: Sync DQM Metric Catalogue

on:
  workflow_dispatch:
  schedule:
    # Setiap Senin pukul 05:30 WIB = Minggu pukul 22:30 UTC
    - cron: "30 22 * * 0"

permissions:
  contents: write

concurrency:
  group: sync-dqm-catalog
  cancel-in-progress: true

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync DQM metric catalogue
        run: node scripts/sync-dqm-catalog.mjs

      - name: Commit and push updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dqm-catalog-live.json data/history/dqm-catalog/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan Katalog Metrik DQM."
          else
            git commit -m "chore(data): update DQM metric catalogue snapshot"
            git push
          fi

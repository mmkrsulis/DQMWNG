name: Sync DQM Weekly

on:
  schedule:
    # Setiap hari Minggu pukul 01:00 WIB (Sabtu 18:00 UTC)
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dqm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Tarik data DQM terbaru
        run: node scripts/sync-dqm.mjs

      - name: Terapkan data live & build ulang slide
        run: |
          if [ -f scripts/apply-dqm-live.cjs ]; then node scripts/apply-dqm-live.cjs; fi
          if [ -f scripts/build.cjs ]; then node scripts/build.cjs; fi

      - name: Jalankan unit test
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test
          fi

      - name: Commit dan push hasil update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dqm-live.json data/history/dqm/
          git add -u
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data baru."
            exit 0
          fi
          git commit -m "chore(dqm): auto-sync weekly snapshot $(TZ=Asia/Jakarta date +%F)"
          git push

name: Probe DQM Metric Catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dqm-catalog-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe public DQM catalogue
        run: node scripts/probe-dqm-catalog.mjs

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dqm-catalog-probe
          path: artifacts/dqm-catalog-probe/
          if-no-files-found: warn
          retention-days: 14

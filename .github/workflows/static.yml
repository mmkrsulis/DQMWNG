# Workflow deploy publikasi presentasi ke GitHub Pages (otomatis & mingguan)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows:
      - "Sync DQM Weekly"
      - "Sync IKD Wonogiri"
      - "Sync Master Sekolah Wonogiri"
      - "Sync DQM Metric Catalogue"
      - "Sync ATS Wonogiri"
      - "Sync Residu PD (VervalPD Staging)"
    types: [completed]
    branches: ["main"]
  schedule:
    # Pengaman mingguan: setiap Senin pukul 07:15 WIB (00:15 UTC) setelah seluruh sync selesai
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build public presentation with all live snapshots
        run: node scripts/build.cjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
